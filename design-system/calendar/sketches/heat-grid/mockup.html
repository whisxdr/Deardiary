<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DearDiary — Calendar (Mood Heat Grid sketch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:        #FAF6F0;   /* primary-50 */
    --card:         #F5F0E6;   /* accent-cream */
    --card-inset:   #F0E6D2;   /* primary-100 */
    --ink:          #3E2723;   /* primary-700  (12.2:1 on card) */
    --ink-soft:     #5D4037;   /* primary-600  (8.2:1) */
    --muted:        #7D5A3C;   /* primary-500  (5.4:1) */
    --muted-2:      #A67C52;   /* primary-400  (3.3:1, large/UI only) */
    --gold:         #C9A961;   /* accent-gold  (1.98:1 — decorative only) */
    --gold-deep:    #6F5220;   /* accent-gold-deep light (6.4:1) — rings/focus/today */
    --sage:         #8A9A5B;   /* accent-sage */
    --rose:         #B76E79;   /* accent-rose */
    --border:       #E0C9A6;   /* primary-200 */
    --border-soft:  #E7D9C4;
    --glyph-on-mood:#F5F0E6;   /* cream glyph on a saturated mood circle */
    --shadow-soft:  0 2px 8px rgba(62, 39, 35, 0.08);
    --shadow-med:   0 4px 16px rgba(62, 39, 35, 0.12);
    --shadow-hard:  0 8px 32px rgba(62, 39, 35, 0.20);
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  }
  [data-theme="night"] {
    --paper:        #1A0F0A;   /* primary-900 */
    --card:         #2A1A14;   /* primary-800 */
    --card-inset:   #241109;
    --ink:          #F0E6D2;   /* primary-100 (13.5:1) */
    --ink-soft:     #E0C9A6;   /* primary-200 (10.4:1) */
    --muted:        #C9A961;   /* primary-300 (7.4:1) */
    --muted-2:      #C9A961;
    --gold:         #C9A961;
    --gold-deep:    #C9A961;   /* accent-gold-deep night (7.4:1) */
    --sage:         #C9A961;
    --rose:         #B76E79;
    --border:       #5D4037;   /* primary-600 */
    --border-soft:  #3E2723;
    --glyph-on-mood:#F5F0E6;
    --shadow-soft:  0 2px 8px rgba(0, 0, 0, 0.45);
    --shadow-med:   0 4px 16px rgba(0, 0, 0, 0.5);
    --shadow-hard:  0 8px 32px rgba(0, 0, 0, 0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    transition: background 250ms cubic-bezier(0.16,1,0.3,1), color 250ms;
  }
  a { color: inherit; }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 22px 28px 6px; max-width: 1320px; margin: 0 auto; }
  .wordmark { font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; line-height: 1; }
  .crumb { font-size: 13px; color: var(--muted); }
  .crumb b { color: var(--ink-soft); font-weight: 600; }
  .topbar .grow { flex: 1; }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
    background: var(--card); color: var(--ink); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
    font-family: 'Inter'; font-weight: 600; font-size: 13px;
    box-shadow: var(--shadow-soft); transition: box-shadow 200ms, border-color 200ms;
  }
  .theme-toggle:hover { box-shadow: var(--shadow-med); border-color: var(--gold-deep); }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 8px 28px 96px; }

  /* ---------- Header / toolbar ---------- */
  .cal-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
  .cal-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(26px, 4vw, 34px); margin: 0; letter-spacing: -0.4px; }
  .cal-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .today-btn {
    font-family: 'Inter'; font-weight: 600; font-size: 13px; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 16px; min-height: 44px; cursor: pointer; transition: background 150ms, border-color 150ms;
  }
  .today-btn:hover { background: var(--card-inset); border-color: var(--gold-deep); }
  .nav-btn {
    width: 44px; height: 44px; display: inline-grid; place-items: center; cursor: pointer;
    background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--ink-soft);
    transition: background 150ms, border-color 150ms;
  }
  .nav-btn:hover { background: var(--card-inset); border-color: var(--gold-deep); }

  /* ---------- Legend ---------- */
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; margin: 18px 0 14px; }
  .legend .lg-label { font-family: 'Inter'; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .intensity { display: flex; align-items: flex-end; gap: 8px; }
  .intensity .sw { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--muted); }
  .intensity .sw i { display: block; font-style: normal; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); text-align: center; margin-top: 23px; }
  .intensity .ends { font-size: 11px; color: var(--muted); padding-bottom: 2px; }
  details.moodkey { width: 100%; }
  details.moodkey summary { cursor: pointer; font-family: 'Inter'; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); list-style: none; display: inline-flex; align-items: center; gap: 7px; }
  details.moodkey summary::-webkit-details-marker { display: none; }
  details.moodkey summary::before { content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform 150ms; }
  details.moodkey[open] summary::before { transform: rotate(90deg); }
  .key-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 16px; margin-top: 12px; }
  .key-grid .k { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .key-grid .k .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--muted); flex: 0 0 auto; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 1fr; gap: 26px; align-items: start; }
  @media (min-width: 1024px) { .layout { grid-template-columns: 1fr 22rem; } }

  /* ---------- Calendar grid ---------- */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  @media (min-width: 768px) { .weekdays, .cal, .cal > [role="row"] { gap: 8px; } }
  .weekdays span { text-align: center; font-family: 'Inter'; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 4px 0; }
  .weekdays span.wk { background: color-mix(in srgb, var(--card) 55%, var(--paper)); border-radius: 4px; }
  .cal { display: flex; flex-direction: column; gap: 4px; }
  .cal > [role="row"] { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal.anim { animation: fade-slide 250ms cubic-bezier(0.16,1,0.3,1) both; }

  .cell {
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    min-width: 44px; min-height: 44px; aspect-ratio: 1 / 1.05; padding: 4px;
    background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    cursor: pointer; text-align: left; overflow: hidden; font: inherit; color: inherit;
    transition: box-shadow 200ms, border-color 200ms, transform 250ms cubic-bezier(0.16,1,0.3,1);
  }
  .cell .fill { position: absolute; inset: 0; z-index: 0; }
  .cell .row { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 2px; }
  .cell .bar { position: relative; z-index: 1; display: flex; gap: 1px; height: 3px; }
  .cell .bar i { flex: 1 1 0; height: 3px; border-radius: 1px; }
  .cell .bar i.more { background-image: repeating-linear-gradient(45deg, currentColor 0 2px, transparent 2px 4px); }

  .chip {
    display: inline-flex; align-items: center; gap: 3px; background: var(--card);
    border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
    font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px; color: var(--ink);
    line-height: 1.5; transition: font-size 200ms;
  }
  .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold-deep); display: none; }
  .cell.today .tdot { display: inline-block; }
  .pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
    font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; color: var(--ink);
    line-height: 1.5; min-width: 15px; text-align: center;
  }

  .cell:not(.out):hover .fill { filter: brightness(1.07); }
  .cell:not(.out):not(.selected):hover { border-color: var(--gold-deep); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gold-deep) 45%, transparent); }
  .cell:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }
  .cell.selected { border-color: var(--gold-deep); box-shadow: 0 0 0 2px var(--gold-deep), var(--shadow-med); transform: scale(1.04); z-index: 3; }
  .cell.selected .chip { font-size: 15px; }
  .cell.out { opacity: 0.32; }
  .cell.out .fill, .cell.out .bar, .cell.out .pill { display: none; }
  .cell.out .chip { color: var(--muted); }

  /* ---------- Detail panel (summary card) ---------- */
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 22px; }
  @media (min-width: 1024px) { .panel { position: sticky; top: 20px; } }
  .panel.anim { animation: fade-slide 250ms cubic-bezier(0.16,1,0.3,1) both; }
  .p-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .p-date .wd { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--muted); }
  .p-date .num { font-family: 'Playfair Display', serif; font-weight: 800; font-size: clamp(48px, 9vw, 66px); line-height: 0.95; letter-spacing: -1px; }
  .p-date .my { font-family: 'Inter'; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stamp { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; box-shadow: var(--shadow-soft); }
  .p-mood { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .p-mood .lab { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; }
  .p-mood .desc { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: var(--muted); }
  .mixed { display: flex; gap: 6px; margin-top: 4px; }
  .mixed .sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--muted); }
  .mixed-badge { text-align: right; }
  .mixed-badge .lab { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px; }
  .mixed-badge .mixed { justify-content: flex-end; }
  .p-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-soft); }
  .p-stats .v { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; }
  .p-stats .k { font-family: 'Inter'; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-top: 2px; }

  /* ---------- Entry cards ---------- */
  .entries { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .ecard { background: color-mix(in srgb, var(--card) 60%, var(--paper)); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 14px; }
  .ecard-head { display: flex; align-items: center; gap: 8px; }
  .mbadge { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; }
  .mood-label { font-family: 'Inter'; font-weight: 600; font-size: 12px; color: var(--ink-soft); }
  .fav { margin-left: auto; background: transparent; border: 0; cursor: pointer; color: var(--muted-2); padding: 6px; border-radius: 6px; }
  .fav:hover { color: var(--gold-deep); }
  .fav.on { color: var(--gold-deep); }
  .ecard-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 17px; margin: 8px 0 3px; }
  .ecard-preview { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); margin: 0; }
  .ecard-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-soft); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .ecard-foot .tag { color: var(--gold-deep); }
  .ecard-foot .priv { display: inline-flex; align-items: center; gap: 4px; }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Inter'; font-weight: 600; font-size: 13px; border-radius: 999px; padding: 10px 18px; min-height: 44px; cursor: pointer; text-decoration: none; border: 1px solid transparent; transition: transform 150ms, box-shadow 150ms, background 150ms, border-color 150ms; }
  .btn-gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .btn-gold:hover { box-shadow: var(--shadow-med); }
  .btn-outline { background: transparent; color: var(--ink-soft); border-color: var(--border); }
  .btn-outline:hover { border-color: var(--gold-deep); background: var(--card-inset); }
  .write-row { margin-top: 16px; }

  /* ---------- Empty day ---------- */
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 18px 6px 6px; }
  .empty h3 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 19px; margin: 6px 0 0; }
  .empty p { font-size: 13.5px; color: var(--muted); margin: 0 0 8px; max-width: 30ch; }

  /* ---------- Focus ---------- */
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; border-radius: 8px; }

  @keyframes fade-slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    .topbar, .wrap { padding-left: 16px; padding-right: 16px; }
    .legend { gap: 10px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .cell.selected { transform: none; }
    .cell:not(.out):hover .fill { filter: none; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <span class="wordmark">DearDiary</span>
    <span class="crumb">/ <b>Calendar</b></span>
    <span class="grow"></span>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch to night mode" aria-pressed="false">
      <span id="toggleIcon" aria-hidden="true"></span>
      <span id="toggleLabel">Night</span>
    </button>
  </header>

  <main class="wrap">
    <div class="cal-head">
      <div>
        <h1 class="cal-title" id="monthTitle" aria-live="polite">October 2026</h1>
        <div class="cal-sub" id="monthSub">25 days · mostly Happy</div>
      </div>
      <div class="cal-nav">
        <button class="today-btn" id="todayBtn" type="button">Today</button>
        <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous month">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn" id="nextBtn" type="button" aria-label="Next month">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="legend">
      <span class="lg-label">Intensity</span>
      <div class="intensity" id="intensityLegend" aria-hidden="true"></div>
      <span class="ends">1 → 4+ entries · darker = more writing</span>
      <details class="moodkey" open>
        <summary>Mood colors</summary>
        <div class="key-grid" id="moodKey"></div>
      </details>
    </div>

    <div class="layout">
      <section aria-label="Month grid">
        <div class="weekdays" id="weekdays"></div>
        <div class="cal" id="cal" role="grid" aria-label="Month grid"></div>
      </section>

      <aside class="panel" id="panel" aria-label="Entries for the selected day"></aside>
    </div>
  </main>

<script>
  /* ===================== Mood data (from src/constants/moods.ts) ===================== */
  const MOODS = {
    happy:     { label: 'Happy',     color: '#F4B400', desc: 'Light and cheerful' },
    sad:       { label: 'Sad',       color: '#5C6BC0', desc: 'Heavy-hearted' },
    angry:     { label: 'Angry',     color: '#E53935', desc: 'Hot under the collar' },
    tired:     { label: 'Tired',     color: '#7E57C2', desc: 'Running low' },
    thoughtful:{ label: 'Thoughtful',color: '#78909C', desc: 'Turning things over' },
    loved:     { label: 'Loved',     color: '#EC407A', desc: 'Warm and cherished' },
    cool:      { label: 'Cool',      color: '#26A69A', desc: 'Confident and easy' },
    anxious:   { label: 'Anxious',   color: '#FF7043', desc: 'On edge' },
    excited:   { label: 'Excited',   color: '#FFC107', desc: 'Buzzing with energy' },
    calm:      { label: 'Calm',      color: '#8A9A5B', desc: 'Settled and quiet' },
    adoring:   { label: 'Adoring',   color: '#AB47BC', desc: 'Full of affection' },
    mindblown: { label: 'Mind-blown',color: '#FF5722', desc: 'Completely amazed' },
  };
  const MOOD_IDS = Object.keys(MOODS);

  /* Mood ink-stamp glyphs (inline SVG, cream on the mood colour). No emoji. */
  const GLYPHS = {
    happy:     '<circle cx="8.5" cy="10" r="1.4" fill="currentColor"/><circle cx="15.5" cy="10" r="1.4" fill="currentColor"/><path d="M8 14.5q4 3.5 8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
    sad:       '<circle cx="8.5" cy="10" r="1.4" fill="currentColor"/><circle cx="15.5" cy="10" r="1.4" fill="currentColor"/><path d="M8 17q4 -3 8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
    angry:     '<path d="M7 8.5l3 1.6M17 8.5l-3 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M8 17q4 -3 8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
    tired:     '<path d="M6.5 10.5h3M14.5 10.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M9 16.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
    thoughtful:'<circle cx="9" cy="10" r="1.4" fill="currentColor"/><path d="M15 9v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M9 16.5q3 1 5 -1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><circle cx="19" cy="6" r="1.1" fill="currentColor"/>',
    loved:     '<path d="M12 20.2s-7.2-4.6-7.2-9.3A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7.2 2.9c0 4.7-7.2 9.3-7.2 9.3z" fill="currentColor"/>',
    cool:      '<rect x="5" y="9.5" width="5.6" height="4.2" rx="1.6" fill="currentColor"/><rect x="13.4" y="9.5" width="5.6" height="4.2" rx="1.6" fill="currentColor"/><path d="M10.6 11.4h2.8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M9.5 16.5q2.5 1.5 5 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>',
    anxious:   '<circle cx="8.5" cy="10" r="1.7" fill="currentColor"/><circle cx="15.5" cy="10" r="1.7" fill="currentColor"/><path d="M8 16q2 -1.6 4 0 q2 1.6 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>',
    excited:   '<path d="M7 9.5q1.6 -2 3.2 0M13.8 9.5q1.6 -2 3.2 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M8 14q4 4.2 8 0z" fill="currentColor"/>',
    calm:      '<path d="M20 4c0 8.5-4.5 13-11.5 13H5.5C5.5 9 10 4.5 20 4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/><path d="M5.5 17c1.5-3 4-5.5 7.5-7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>',
    adoring:   '<path d="M12 19s-6-3.8-6-7.8a3.3 3.3 0 0 1 6-1.9 3.3 3.3 0 0 1 6 1.9c0 4-6 7.8-6 7.8z" fill="currentColor"/><path d="M18.5 3.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="currentColor"/>',
    mindblown: '<path d="M12 2.5l1.9 5.1 5.1 1.9-5.1 1.9-1.9 5.1-1.9-5.1L5 9.5l5.1-1.9z" fill="currentColor"/>',
  };
  function glyph(mood, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" style="color:var(--glyph-on-mood)" aria-hidden="true">' + (GLYPHS[mood] || GLYPHS.calm) + '</svg>';
  }

  /* ===================== Authored October 2026 (the hero month) ===================== */
  function e(mood, title, preview, o) {
    o = o || {};
    return { mood: mood, title: title, preview: preview, tags: o.tags || [], words: o.words || 80,
      minutes: Math.max(1, Math.round((o.words || 80) / 200)), location: o.location || null,
      private: !!o.private, favorite: !!o.favorite };
  }
  const AUTHORED_OCT = {
    1:  [e('calm','A slow, kind start','Rain on the window, coffee going cold, and nowhere to be.',{words:132,tags:['morning']})],
    2:  [e('happy','Small wins','Finished the thing I had been avoiding for a whole week.',{words:88,tags:['work']}),
         e('happy','Evening walk','Golden hour over the park; the whole city looked forgiving.',{words:145,tags:['evening','gratitude'],favorite:true})],
    5:  [e('excited','The idea','It hit me on the bus and I scribbled it on my hand.',{words:76,tags:['ideas']})],
    6:  [e('happy','Good bones','The project finally has a shape I recognise.',{words:210,tags:['work']}),
         e('excited','Lunch with Mira','Two hours vanished. Worth every one.',{words:64,tags:['friends']}),
         e('happy','Tired but lit up','Wrung out in the best way.',{words:52})],
    7:  [e('loved','Called Mom','She talked forty minutes about her tomatoes. I did not mind.',{words:98,tags:['family']})],
    8:  [e('happy','Momentum','Three days in a row of showing up.',{words:120}),
         e('loved','His text','“Thinking of you.” Four words, whole day lifted.',{words:58,tags:['love']}),
         e('happy','Wrapped up warm','Early night, no guilt.',{words:70})],
    9:  [e('excited','It shipped','We pushed it live. Nobody screamed.',{words:180,tags:['work'],favorite:true}),
         e('excited','Celebratory noodles','Cheap, perfect, earned.',{words:54}),
         e('happy','The team','Grateful for these specific people.',{words:88}),
         e('excited','Cannot sleep','Too much good buzzing in my head.',{words:44})],
    11: [e('thoughtful','Turning it over','Something is shifting and I am not sure I want to name it yet.',{words:164})],
    12: [e('anxious','The email','Read it four times. Still not sure of the tone.',{words:72,tags:['work']}),
         e('anxious','Restless','Paced the flat until my legs complained.',{words:60})],
    13: [e('anxious','On edge all day','Waiting for news that has not come.',{words:96,tags:['work']}),
         e('sad','Heavy by evening','The quiet got loud.',{words:78,private:true})],
    14: [e('sad','Not much to report','A gray day that asked nothing and gave less.',{words:110}),
         e('tired','Running on fumes','Slept badly, worse for it.',{words:66}),
         e('sad','Let it be sad','Did not fight it this time.',{words:92,private:true})],
    15: [e('tired','Low battery','Cancelled everything. Slept.',{words:48})],
    16: [e('loved','A quieter kind of brave','We finally talked it through. No thunder, just truth.',{words:128,tags:['love','honest'],favorite:true}),
         e('calm','Afterward','Made tea. Sat in the calm we had earned.',{words:84}),
         e('loved','Held','Fell asleep feeling safe. Noted, so I remember it on gray days.',{words:96})],
    17: [e('calm','Settled','Nothing happened. It was enough.',{words:70})],
    19: [e('calm','Slow morning','Read in bed till the light changed.',{words:88}),
         e('thoughtful','A question I keep','What am I actually building toward?',{words:120})],
    20: [e('cool','Handled it','The thing that would have rattled me last month? Easy.',{words:74})],
    21: [e('thoughtful','Middle of the week','Neither up nor down. Just here.',{words:100}),
         e('calm','Found centre','Twenty minutes of nothing and it helped.',{words:66}),
         e('loved','Grateful, quietly','For the ordinary goodness around me.',{words:82})],
    22: [e('angry','The injustice','Someone was careless with something I care about.',{words:104,tags:['work']})],
    23: [e('happy','Turned a corner','The week remembered how to be kind.',{words:92})],
    26: [e('calm','Sunday reset','Cleaned, planned, breathed.',{words:86})],
    27: [e('adoring','Watched them sleep','Overcome with affection for small noses.',{words:64,tags:['family'],private:true})],
    28: [e('calm','Steady','Same good rhythm as yesterday.',{words:78}),
         e('calm','Grateful list','Three things, as always.',{words:58})],
    29: [e('happy','Good news','It is happening. The thing I wanted.',{words:118}),
         e('excited','Buzzing','Told everyone. Twice.',{words:50})],
    30: [e('excited','Countdown','Tomorrow is the day and I am ready.',{words:64})],
    31: [e('mindblown','Did not see that coming','The best kind of surprise.',{words:72})],
  };

  /* ===================== Heat model ===================== */
  const HEAT_LIGHT = [0, 0.18, 0.38, 0.60, 0.85];
  const HEAT_NIGHT = [0, 0.24, 0.46, 0.68, 0.90];
  function level(count) { return count <= 0 ? 0 : Math.min(4, count); }
  function dominant(moods) { const c = {}; let best = moods[0], bn = 0; for (const m of moods) { c[m] = (c[m] || 0) + 1; if (c[m] > bn) { bn = c[m]; best = m; } } return best; }
  function heatAlpha() { return document.documentElement.getAttribute('data-theme') === 'night' ? HEAT_NIGHT : HEAT_LIGHT; }
  function hexToRgba(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }

  /* ===================== State ===================== */
  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MOCK_TODAY = new Date(2026, 9, 13);       // the sketch's "today"
  let dispYear = 2026, dispMonth = 9;             // displayed month (0-indexed)
  let monthData = {};                              // day-of-month -> entries[]
  let selected = new Date(2026, 9, 16);            // selected day

  function synthEntry(mood, day, i) {
    const M = MOODS[mood];
    const titles = ['A ' + M.label.toLowerCase() + ' kind of day','Notes to self','Untitled page','Just getting it down'];
    const words = 48 + ((day * 37 + i * 53) % 190);
    return { mood: mood, title: titles[(day + i) % titles.length], preview: M.desc + '. The day asked to be written down, so here it is.',
      tags: [], words: words, minutes: Math.max(1, Math.round(words / 200)), location: null,
      private: (day % 11 === 0 && i === 1), favorite: (i === 0 && day % 9 === 0) };
  }
  function genMonth(y, m) {
    const dim = new Date(y, m + 1, 0).getDate();
    let seed = ((y * 12 + m) * 2654435761) % 2147483647; if (seed <= 0) seed += 2147483646;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const map = {};
    for (let d = 1; d <= dim; d++) {
      const r = rnd();
      if (r < 0.3) continue;
      const n = r < 0.52 ? 1 : r < 0.74 ? 2 : r < 0.9 ? 3 : 4;
      const arr = [];
      for (let i = 0; i < n; i++) arr.push(synthEntry(MOOD_IDS[Math.floor(rnd() * MOOD_IDS.length)], d, i));
      map[d] = arr;
    }
    return map;
  }
  function buildMonthData() {
    monthData = (dispYear === 2026 && dispMonth === 9) ? AUTHORED_OCT : genMonth(dispYear, dispMonth);
  }
  function entriesFor(date) {
    if (date.getFullYear() === dispYear && date.getMonth() === dispMonth) return monthData[date.getDate()] || [];
    return [];
  }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

  /* ===================== Render: weekdays + legend + key ===================== */
  const WEEKDAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function renderWeekdays() {
    document.getElementById('weekdays').innerHTML = WEEKDAYS.map((d, i) =>
      '<span class="' + (i === 0 || i === 6 ? 'wk' : '') + '" role="columnheader" aria-label="' + WEEKDAY_FULL[i] + '"><span aria-hidden="true">' + d + '</span></span>'
    ).join('');
  }
  function renderIntensityLegend() {
    const ref = MOODS.calm.color, A = heatAlpha();
    document.getElementById('intensityLegend').innerHTML = [1,2,3,4].map((lv, i) =>
      '<span class="sw" style="background:' + hexToRgba(ref, A[lv]) + '"><i>' + (lv === 4 ? '4+' : lv) + '</i></span>'
    ).join('');
  }
  function renderMoodKey() {
    document.getElementById('moodKey').innerHTML = MOOD_IDS.map((id) =>
      '<div class="k"><span class="sw" style="background:' + MOODS[id].color + '"></span>' + MOODS[id].label + '</div>'
    ).join('');
  }

  /* ===================== Render: grid ===================== */
  function monthSummary() {
    const days = Object.keys(monthData).length;
    const tally = {};
    Object.values(monthData).forEach((arr) => arr.forEach((en) => { tally[en.mood] = (tally[en.mood] || 0) + 1; }));
    let top = null, tn = 0;
    for (const id of MOOD_IDS) { if ((tally[id] || 0) > tn) { tn = tally[id]; top = id; } }
    return days + ' days · mostly ' + (top ? MOODS[top].label : '—');
  }
  function renderGrid(animate) {
    const first = new Date(dispYear, dispMonth, 1);
    const start = new Date(first); start.setDate(start.getDate() - first.getDay());
    const cells = [];
    for (let i = 0; i < 35; i++) { const d = new Date(start); d.setDate(start.getDate() + i); cells.push(d); }

    let html = '';
    for (let w = 0; w < 5; w++) {
      html += '<div role="row">';
      for (let c = 0; c < 7; c++) {
        const d = cells[w * 7 + c];
        const inMonth = d.getMonth() === dispMonth && d.getFullYear() === dispYear;
        const entries = entriesFor(d);
        const moods = entries.map((en) => en.mood);
        const count = entries.length;
        const lv = level(count);
        const dom = count ? dominant(moods) : null;
        const isToday = sameDay(d, MOCK_TODAY);
        const isSel = sameDay(d, selected);
        const label = WEEKDAY_FULL[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() +
          (inMonth ? '' : ' (other month)') + ' — ' +
          (count ? MOODS[dom].label + ', ' + count + (count === 1 ? ' entry' : ' entries') : 'no entries') +
          (isToday ? ', today' : '');
        const fillBg = (inMonth && count) ? hexToRgba(MOODS[dom].color, heatAlpha()[lv]) : '';
        const segs = moods.slice(0, 4).map((m, idx) =>
          '<i style="background:' + MOODS[m].color + (idx === 3 && count > 4 ? ';color:' + MOODS[m].color : '') + '" class="' + (idx === 3 && count > 4 ? 'more' : '') + '"></i>'
        ).join('');
        html += '<button type="button" role="gridcell" class="cell' + (inMonth ? '' : ' out') + (isToday ? ' today' : '') + (isSel ? ' selected' : '') + '"' +
          ' data-date="' + d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '"' +
          ' aria-pressed="' + (isSel ? 'true' : 'false') + '" aria-label="' + label + '" tabindex="' + (isSel ? '0' : '-1') + '">' +
          '<span class="fill" style="' + (fillBg ? 'background:' + fillBg : '') + '"></span>' +
          '<span class="row"><span class="chip"><span class="tdot"></span>' + d.getDate() + '</span>' +
          (count ? '<span class="pill">' + count + '</span>' : '') + '</span>' +
          (count ? '<span class="bar">' + segs + '</span>' : '') +
          '</button>';
      }
      html += '</div>';
    }
    const cal = document.getElementById('cal');
    cal.innerHTML = html;
    if (animate) { cal.classList.remove('anim'); void cal.offsetWidth; cal.classList.add('anim'); }
  }
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  /* ===================== Render: detail panel ===================== */
  function emptyDiarySVG() {
    return '<svg width="190" height="143" viewBox="0 0 400 300" fill="none" role="img" aria-label="An open journal with blank pages">' +
      '<ellipse cx="200" cy="252" rx="140" ry="14" fill="var(--card-inset)"/>' +
      '<path d="M60 90h130v150H60z" fill="var(--paper)" stroke="var(--ink-soft)" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M340 90H210v150h130z" fill="var(--paper)" stroke="var(--ink-soft)" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M190 84h20v162h-20z" fill="var(--ink-soft)" opacity="0.35"/>' +
      '<path d="M84 122h84M84 144h84M84 166h56" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M232 122h84M232 144h84M232 166h56" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/></svg>';
  }
  function entryCard(en) {
    const tags = en.tags.slice(0, 3).map((t) => '<span class="tag">#' + t + '</span>').join('');
    return '<article class="ecard">' +
      '<div class="ecard-head"><span class="mbadge" style="background:' + MOODS[en.mood].color + '">' + glyph(en.mood, 13) + '</span>' +
      '<span class="mood-label">' + MOODS[en.mood].label + '</span>' +
      '<button type="button" class="fav' + (en.favorite ? ' on' : '') + '" aria-pressed="' + (en.favorite ? 'true' : 'false') + '" aria-label="' + (en.favorite ? 'Remove from favorites' : 'Add to favorites') + '">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + (en.favorite ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z" stroke-linejoin="round"/></svg></button></div>' +
      '<h4 class="ecard-title">' + en.title + '</h4>' +
      '<p class="ecard-preview">' + en.preview + '</p>' +
      '<div class="ecard-foot"><span>' + en.words + ' words</span><span>' + en.minutes + ' min</span>' + tags +
      (en.location ? '<span>' + en.location + '</span>' : '') +
      (en.private ? '<span class="priv"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Private</span>' : '') +
      '</div></article>';
  }
  function renderPanel(animate) {
    const entries = entriesFor(selected);
    const d = selected;
    const moods = entries.map((en) => en.mood);
    const words = entries.reduce((s, en) => s + en.words, 0);
    const distinct = new Set(moods).size;
    const dom = moods.length ? dominant(moods) : null;

    const moodSwatches = [...new Set(moods)].slice(0, 3).map((m) => '<span class="sw" style="background:' + MOODS[m].color + '"></span>').join('');
    const stampHTML = !moods.length ? '' :
      (distinct >= 3
        ? '<div class="mixed-badge"><span class="lab">Mixed</span><div class="mixed">' + moodSwatches + '</div></div>'
        : '<span class="stamp" style="background:' + MOODS[dom].color + '">' + glyph(dom, 28) + '</span>');

    const head = '<div class="p-top"><div class="p-date"><div class="wd">' + WEEKDAY_FULL[d.getDay()] + '</div>' +
      '<div class="num">' + d.getDate() + '</div><div class="my">' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</div></div>' +
      stampHTML + '</div>';

    let moodBlock = '';
    if (moods.length) {
      moodBlock = distinct >= 3
        ? '<div class="p-mood"><div><div class="desc">A varied day, a few feelings at once.</div></div></div>'
        : '<div class="p-mood"><div><div class="lab">' + MOODS[dom].label + '</div><div class="desc">' + MOODS[dom].desc + '</div></div></div>';
    }

    const stats = moods.length
      ? '<div class="p-stats"><div><div class="v">' + entries.length + '</div><div class="k">Entries</div></div>' +
        '<div><div class="v">' + words + '</div><div class="k">Words</div></div>' +
        '<div><div class="v">' + distinct + '</div><div class="k">Moods</div></div></div>'
      : '';

    const body = moods.length
      ? '<div class="entries">' + entries.map(entryCard).join('') + '</div>' +
        '<div class="write-row"><button type="button" class="btn btn-outline">Write this day</button></div>'
      : '<div class="empty">' + emptyDiarySVG() + '<h3>Nothing written yet</h3><p>This day is still a blank page. Start writing and it will appear here.</p>' +
        '<button type="button" class="btn btn-gold">Write this day</button></div>';

    const panel = document.getElementById('panel');
    panel.innerHTML = head + moodBlock + stats + body;
    if (animate) { panel.classList.remove('anim'); void panel.offsetWidth; panel.classList.add('anim'); }
  }

  /* ===================== Selection + keyboard (roving tabindex) ===================== */
  function select(date, focus) {
    selected = date;
    renderGrid(false);
    renderPanel(true);
    if (focus) {
      const key = date.getFullYear() + '-' + date.getMonth() + '-' + date.getDate();
      const el = document.querySelector('.cell[data-date="' + key + '"]');
      if (el) el.focus();
    }
  }
  document.getElementById('cal').addEventListener('click', (ev) => {
    const cell = ev.target.closest('.cell'); if (!cell) return;
    const p = cell.dataset.date.split('-');
    select(new Date(+p[0], +p[1], +p[2]), false);
  });
  document.getElementById('cal').addEventListener('keydown', (ev) => {
    const cells = [...document.querySelectorAll('.cell')];
    const cur = document.activeElement.closest('.cell');
    const idx = cells.indexOf(cur); if (idx < 0) return;
    let next = null;
    if (ev.key === 'ArrowRight') next = idx + 1;
    else if (ev.key === 'ArrowLeft') next = idx - 1;
    else if (ev.key === 'ArrowDown') next = idx + 7;
    else if (ev.key === 'ArrowUp') next = idx - 7;
    else if (ev.key === 'Home') next = idx - (idx % 7);
    else if (ev.key === 'End') next = idx - (idx % 7) + 6;
    else if (ev.key === 'PageDown') next = idx + 28;
    else if (ev.key === 'PageUp') next = idx - 28;
    else if (ev.key === 'Enter' || ev.key === ' ') { const p = cur.dataset.date.split('-'); select(new Date(+p[0], +p[1], +p[2]), true); ev.preventDefault(); return; }
    if (next !== null && cells[next]) { ev.preventDefault(); const p = cells[next].dataset.date.split('-'); select(new Date(+p[0], +p[1], +p[2]), true); }
  });

  /* ===================== Month navigation ===================== */
  function goMonth(delta) {
    let m = dispMonth + delta, y = dispYear;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    dispYear = y; dispMonth = m; buildMonthData();
    selected = new Date(y, m, 1);
    document.getElementById('monthTitle').textContent = MONTHS[m] + ' ' + y;
    document.getElementById('monthSub').textContent = monthSummary();
    renderGrid(true); renderPanel(true);
  }
  document.getElementById('prevBtn').addEventListener('click', () => goMonth(-1));
  document.getElementById('nextBtn').addEventListener('click', () => goMonth(1));
  document.getElementById('todayBtn').addEventListener('click', () => {
    dispYear = MOCK_TODAY.getFullYear(); dispMonth = MOCK_TODAY.getMonth(); buildMonthData();
    document.getElementById('monthTitle').textContent = MONTHS[dispMonth] + ' ' + dispYear;
    document.getElementById('monthSub').textContent = monthSummary();
    select(MOCK_TODAY, false);
  });

  /* ===================== Theme toggle ===================== */
  const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></g></svg>';
  const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>';
  const root = document.documentElement, tBtn = document.getElementById('themeToggle');
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    const night = t === 'night';
    tBtn.setAttribute('aria-pressed', night ? 'true' : 'false');
    tBtn.setAttribute('aria-label', night ? 'Switch to light mode' : 'Switch to night mode');
    document.getElementById('toggleLabel').textContent = night ? 'Light' : 'Night';
    document.getElementById('toggleIcon').innerHTML = night ? SUN : MOON;
    try { localStorage.setItem('dd-cal-theme', t); } catch (err) {}
    renderGrid(false); renderIntensityLegend();   /* refill heat with the theme's alphas */
  }
  tBtn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'night' ? 'light' : 'night'));
  let saved = null; try { saved = localStorage.getItem('dd-cal-theme'); } catch (err) {}
  if (saved) setTheme(saved);

  /* ===================== Boot ===================== */
  renderWeekdays(); renderIntensityLegend(); renderMoodKey();
  buildMonthData();
  document.getElementById('monthSub').textContent = monthSummary();
  renderGrid(false); renderPanel(false);
</script>
</body>
