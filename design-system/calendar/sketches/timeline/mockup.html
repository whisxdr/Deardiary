<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DearDiary — Calendar (Diary Timeline sketch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ---------- Tokens (mirror theme.css + tailwind.config.js) ---------- */
  :root {
    --paper:      #FAF6F0;   /* primary-50 */
    --card:       #F5F0E6;   /* accent-cream */
    --ink:        #3E2723;   /* primary-700 — body/headings */
    --ink-soft:   #5D4037;   /* primary-600 — secondary text */
    --muted:      #7D5A3C;   /* primary-500 — meta/quiet date (AA) */
    --muted-2:    #A67C52;   /* primary-400 — decorative only */
    --gold:       #C9A961;   /* accent-gold — fills/rings only */
    --gold-deep:  #6F5220;   /* accent-gold-deep — gold TEXT on cream */
    --sage:       #8A9A5B;
    --rose:       #B76E79;
    --ink-accent: #1A237E;
    --border:     #E0C9A6;   /* primary-200 */
    --border-soft:#E7D9C4;
    --spine:      #D98A7E;   /* --ledger-rule (light) */
    --shadow-soft: 0 2px 8px rgba(62,39,35,0.08);
    --shadow-med:  0 4px 16px rgba(62,39,35,0.12);
    --today-chip-bg: #3E2723;
    --today-chip-fg: #F5F0E6;
    --radius: 16px;
    --radius-md: 8px;
    --gutter: 28px;
  }
  [data-theme="night"] {
    --paper:      #1A0F0A;   /* primary-900 */
    --card:       #2A1A14;   /* primary-800 */
    --ink:        #F0E6D2;   /* primary-100 */
    --ink-soft:   #E0C9A6;   /* primary-200 */
    --muted:      #C9A961;   /* primary-300 — 7.43:1 on card */
    --muted-2:    #A67C52;
    --gold:       #C9A961;
    --gold-deep:  #C9A961;   /* night: gold is AA as text */
    --sage:       #A9B573;
    --rose:       #D98A9A;
    --ink-accent: #D9CBB0;
    --border:     #5D4037;   /* primary-700 */
    --border-soft:#3E2723;
    --spine:      #A15B52;   /* --ledger-rule (night) */
    --shadow-soft: 0 2px 8px rgba(0,0,0,0.45);
    --shadow-med:  0 4px 16px rgba(0,0,0,0.5);
    --today-chip-bg: #F0E6D2;
    --today-chip-fg: #1A0F0A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 16% 6%, rgba(201,169,97,0.05), transparent 40%),
      radial-gradient(circle at 90% 88%, rgba(183,110,121,0.04), transparent 44%);
    background-attachment: fixed;
  }
  button { font-family: inherit; cursor: pointer; }
  a { cursor: pointer; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 120px; }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    position: fixed; top: 20px; right: 24px; z-index: 61;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 15px; box-shadow: var(--shadow-soft);
    transition: box-shadow 250ms cubic-bezier(0.16,1,0.3,1), transform 250ms, border-color 250ms;
  }
  .theme-toggle:hover { box-shadow: var(--shadow-med); transform: translateY(-1px); border-color: var(--gold); }
  .theme-toggle:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- Wordmark ---------- */
  .wordmark { font-family: 'Caveat', cursive; font-weight: 700; font-size: 34px; color: var(--ink); }

  /* ---------- Header (month nav) ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 10px; flex-wrap: wrap; }
  .month-title { font-family: 'Playfair Display', serif; font-weight: 800; font-size: clamp(24px,4vw,30px); margin: 0; letter-spacing: -0.5px; }
  .month-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .nav { display: flex; align-items: center; gap: 6px; }
  .nav-btn {
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-md); border: 1px solid var(--border); background: transparent; color: var(--ink-soft);
    transition: background 150ms, border-color 150ms, transform 150ms;
  }
  .nav-btn:hover { background: rgba(201,169,97,0.12); border-color: var(--gold); }
  .nav-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .today-btn {
    height: 44px; padding: 0 16px; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; font-weight: 600;
    transition: background 150ms, border-color 150ms, color 150ms;
  }
  .today-btn:hover { background: rgba(201,169,97,0.12); border-color: var(--gold); color: var(--ink); }
  .today-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- Month minimap ---------- */
  .minimap {
    border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card);
    box-shadow: var(--shadow-soft); padding: 12px 14px; margin-bottom: 8px;
  }
  .mm-row { display: grid; grid-template-columns: repeat(31, 1fr); gap: 3px; align-items: center; }
  .mm-tick { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .mm-num { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); line-height: 1; }
  .mm-dot { width: 10px; height: 10px; border-radius: 50%; background: transparent; border: 1px solid var(--border-soft); }
  .mm-dot.has { border: none; }
  .mm-caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--gold-deep); }
  .mm-legend { display: flex; align-items: center; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .mm-legend .k { display: inline-flex; align-items: center; gap: 5px; }
  .mm-legend .sw { width: 10px; height: 10px; border-radius: 50%; }

  /* ---------- Desktop layout ---------- */
  .layout { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 10px; }
  @media (min-width: 1024px) {
    .layout { grid-template-columns: 200px 1fr; gap: 40px; align-items: start; }
    .rail { position: sticky; top: 24px; }
    .wrap { padding-left: 40px; padding-right: 40px; }
    :root { --gutter: 32px; }
  }

  /* ---------- Sticky week rail (desktop) ---------- */
  .rail { display: none; }
  @media (min-width: 1024px) { .rail { display: block; } }
  .rail h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.6px; color: var(--muted); margin: 0 0 10px; }
  .rail-list { display: flex; flex-direction: column; gap: 4px; }
  .rail-jump {
    text-align: left; background: transparent; border: 1px solid transparent; border-radius: var(--radius-md);
    padding: 8px 10px; color: var(--ink-soft); font-size: 13px; transition: background 150ms, border-color 150ms;
  }
  .rail-jump:hover { background: rgba(201,169,97,0.12); border-color: var(--gold); }
  .rail-jump.active { background: rgba(201,169,97,0.16); border-color: var(--gold); color: var(--ink); font-weight: 600; }
  .rail-jump .cnt { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-left: 6px; }
  .rail-jump:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; max-width: 720px; }
  .spine { position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--spine); transform-origin: top; }
  .week { margin: 0; padding: 0; list-style: none; }
  .week-band { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
  .week-band .rule { flex: 1; height: 1px; background: var(--border-soft); }
  .week-band .label { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .week-band .range { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted-2); white-space: nowrap; }
  .week:first-of-type .week-band { margin-top: 6px; }

  /* Day node (shared row) */
  .day { position: relative; padding-left: calc(var(--gutter) + 12px); margin-bottom: 20px; }
  .day-head { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; text-align: left; width: 100%; color: inherit; }
  .day-head:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; border-radius: 4px; }
  .node-dot {
    position: absolute; left: 0; top: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--spine);
  }
  .day.has .node-dot { background: var(--mood, var(--gold)); border-color: var(--paper); }
  .day.today .node-dot { box-shadow: 0 0 0 4px rgba(201,169,97,0.28); }
  .day-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: var(--ink); }
  .day.today .day-num { background: var(--today-chip-bg); color: var(--today-chip-fg); border-radius: 4px; padding: 1px 6px; }
  .day-wd { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .day-tag { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .day-tag .today-pill { background: var(--gold-deep); color: var(--card); border-radius: 999px; padding: 2px 9px; font-size: 10px; font-weight: 700; }

  /* Collapsed preview (entry day) */
  .preview { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .mood-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink-soft); white-space: nowrap; }
  .preview-text { font-size: 14px; color: var(--ink-soft); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day.has .preview-text { margin-top: 6px; display: block; white-space: normal; }

  /* Quiet marker */
  .day.quiet .day-head { padding: 11px 0; min-height: 44px; }
  .day.quiet .day-num { color: var(--muted); font-weight: 500; }
  .day.quiet .day-wd { color: var(--muted); }
  .quiet-note { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: var(--muted); margin: 2px 0 8px; }

  /* Expanded detail (selected day) */
  .day.expanded .node-dot { transform: scale(1.2); }
  .detail { margin-top: 10px; }
  .detail-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-soft); padding: 18px 20px;
  }
  .day.selected .detail-card { border-color: var(--gold); box-shadow: var(--shadow-med), 0 0 0 1px var(--gold); }
  .detail-head { display: flex; flex-direction: column; gap: 3px; margin-bottom: 14px; }
  .detail-date { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; color: var(--ink); margin: 0; }
  .detail-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }

  .entry { border-top: 1px solid var(--border-soft); padding-top: 14px; margin-top: 14px; }
  .entry:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .entry-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .entry-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 18px; color: var(--ink); margin: 10px 0 4px; line-height: 1.25; }
  .entry-body { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 12px; }
  .fav-btn { background: none; border: none; padding: 6px; border-radius: 6px; color: var(--muted); line-height: 0; transition: color 150ms, background 150ms; }
  .fav-btn:hover { color: var(--gold); background: rgba(201,169,97,0.12); }
  .fav-btn.on { color: var(--gold); }
  .fav-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .entry-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border-soft); padding-top: 10px; }
  .entry-foot .it { display: inline-flex; align-items: center; gap: 5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold-deep); background: rgba(201,169,97,0.14); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; }

  /* Write-this-day buttons */
  .write-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: var(--radius-md);
    font-size: 14px; font-weight: 600; text-decoration: none; margin-top: 14px;
    transition: transform 150ms, filter 150ms, background 150ms, border-color 150ms;
  }
  .write-btn.gold { background: var(--gold); color: var(--today-chip-fg); border: 1px solid var(--gold); }
  [data-theme="night"] .write-btn.gold { color: #1A0F0A; }
  .write-btn.gold:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .write-btn.outline { background: transparent; color: var(--ink); border: 1px solid var(--muted-2); }
  .write-btn.outline:hover { background: rgba(201,169,97,0.12); border-color: var(--gold); }
  .write-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* Inline empty state (selected quiet day) */
  .inline-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 0 4px; gap: 4px; }
  .inline-empty .t { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px; color: var(--ink); }
  .inline-empty .d { font-size: 13px; color: var(--muted); max-width: 34ch; }

  /* Month-level empty note */
  .month-empty { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: var(--muted); padding: 10px 0 4px; }

  /* ---------- Reveal ---------- */
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity 450ms cubic-bezier(0.16,1,0.3,1), transform 450ms cubic-bezier(0.16,1,0.3,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .wrap { padding: 20px 16px 100px; }
    .mm-row { gap: 2px; }
    .mm-num { font-size: 8px; }
    .preview-text { white-space: normal; }
    .cal-head { gap: 8px; }
  }

  /* ---------- Reduced motion (mandatory) ---------- */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
    .spine { transform: none !important; }
    .day.today .node-dot { box-shadow: 0 0 0 3px rgba(201,169,97,0.4); animation: none !important; }
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Switch to night mode" aria-pressed="false">
  <span id="toggleIcon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg></span>
  <span id="toggleLabel">Night</span>
</button>

<div class="wrap">
  <div class="wordmark">DearDiary</div>

  <!-- CalendarHeader -->
  <header class="cal-head">
    <div>
      <h2 class="month-title" id="monthTitle" aria-live="polite">October 2026</h2>
      <div class="month-sub" id="monthSub">14 entries across 13 days</div>
    </div>
    <div class="nav">
      <button class="today-btn" id="todayBtn" type="button">Today</button>
      <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>

  <!-- Month minimap (at-a-glance compensation) -->
  <div class="minimap" id="minimap" aria-label="October at a glance">
    <div class="mm-row" id="mmRow"></div>
    <div class="mm-legend">
      <span class="k"><span class="sw" style="background:#F4B400"></span>Happy</span>
      <span class="k"><span class="sw" style="background:#78909C"></span>Thoughtful</span>
      <span class="k"><span class="sw" style="background:#8A9A5B"></span>Calm</span>
      <span class="k"><span class="sw" style="background:#26A69A"></span>Cool</span>
      <span class="k"><span class="sw" style="background:#5C6BC0"></span>Sad</span>
      <span class="k"><span class="sw" style="background:#7E57C2"></span>Tired</span>
      <span class="k"><span class="sw" style="background:#EC407A"></span>Loved</span>
      <span class="k"><span class="sw" style="background:#FF7043"></span>Excited</span>
      <span class="k"><span class="sw" style="background:transparent;border:1px solid var(--border-soft)"></span>quiet</span>
    </div>
  </div>

  <!-- Layout: sticky week rail + timeline -->
  <div class="layout">
    <nav class="rail" aria-label="Jump to week">
      <h2>Jump to week</h2>
      <div class="rail-list" id="railList"></div>
    </nav>

    <main>
      <section class="timeline" id="timeline" aria-label="October 2026 timeline">
        <div class="spine" id="spine" aria-hidden="true"></div>
        <div id="weeks"></div>
      </section>
    </main>
  </div>
</div>

<script>
  /* ================= Data: October 2026 ================= */
  const MOODS = {
    happy:'#F4B400', sad:'#5C6BC0', angry:'#E53935', tired:'#7E57C2',
    thoughtful:'#78909C', loved:'#EC407A', cool:'#26A69A', anxious:'#FF7043',
    excited:'#FFC107', calm:'#8A9A5B', adoring:'#AB47BC', mindblown:'#FF5722'
  };
  const MOOD_LABEL = {
    happy:'Happy', sad:'Sad', angry:'Angry', tired:'Tired', thoughtful:'Thoughtful',
    loved:'Loved', cool:'Cool', anxious:'Anxious', excited:'Excited', calm:'Calm',
    adoring:'Adoring', mindblown:'Mind-blown'
  };
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTH = 'October 2026';
  const TODAY = 13;   // Tuesday, October 13 2026
  const YEAR = 2026, MONTH_IDX = 9; // 0-based October

  // keyed by day-of-month. Each entry mirrors EntryCard fields.
  const ENTRIES = {
    1:  [ e('The first morning of October', 'happy', 'The first morning of October felt like mine again — the light came in sideways and I let the coffee go cold just watching it move across the floor.', 214, 1, ['morning','light'], 'Home', false, true, '07:42') ],
    3:  [ e('Along the canal', 'thoughtful', 'Walked the long way home along the canal. Thought about how a year can hold so much and still feel like it is only just beginning.', 388, 2, ['walk','thinking'], 'The canal', false, false, '18:20') ],
    5:  [ e('Fresh ink', 'cool', 'Started a new notebook today. There is something about a blank first page that makes the whole book feel possible again.', 176, 1, ['notebook'], null, false, false, '21:05') ],
    8:  [ e('Deadline weather', 'anxious', 'The deadline is breathing down my neck and I keep rearranging my desk instead of the slides. Tomorrow I start for real.', 240, 1, ['work','stress'], 'Office', false, false, '23:11') ],
    10: [ e('Loud and bright', 'excited', 'The concert was everything. We were pressed up near the front and for two hours I forgot every single thing I was worried about.', 305, 2, ['music','night'], 'The Venue', false, false, '00:38') ],
    11: [
      e('Slow Sunday', 'calm', 'No plans, no alarm. Read in the window seat until the afternoon light ran out. Some days are just for resting.', 268, 1, ['rest','reading'], 'Home', true, false, '11:14'),
      e('Soup experiment', 'cool', 'Tried the roasted squash soup from the borrowed cookbook. It turned out — barely. Adding too much nutmeg is a mistake I will remember.', 132, 1, ['cooking'], 'Home', false, false, '19:47')
    ],
    13: [ e('Almost halfway', 'thoughtful', 'Thirteen days in and the month already feels full. Made a list of small things I want to keep doing when the busy weeks come back.', 342, 2, ['reflection','habits'], 'Home', false, false, '20:03') ],
    15: [ e('Rain, again', 'sad', 'It rained all day and I let it sit on me heavier than I meant to. Missing people I do not get to see enough.', 198, 1, ['rain','missing'], 'Home', true, false, '17:29') ],
    23: [ e('Called home', 'loved', 'A long call with family, the kind where you talk about nothing and everything. Left the phone call lighter than I picked it up.', 221, 1, ['family'], null, false, false, '20:55') ],
    25: [ e('Market morning', 'happy', 'Bought too many tomatoes at the farmers market and ate one standing up in the sun like a child. The whole week tasted better after.', 256, 1, ['market','sun'], 'Market Square', false, false, '10:22') ],
    27: [ e('Late night, good tune', 'excited', 'Found an old playlist and stayed up far too late dancing around the kitchen with the lights off. Joy does not need a reason.', 149, 1, ['music','late'], 'Home', false, false, '01:12') ],
    30: [ e('Quiet Friday', 'calm', 'A slow, ordinary, good day. Tidied, stretched, made tea. Not every page has to be a chapter.', 187, 1, ['ordinary'], 'Home', false, false, '16:40') ],
    31: [ e('Last light of October', 'happy', 'The last day of the month and the sky went pink over the rooftops. Closing this book already a little grateful for the next.', 233, 1, ['evening','month'], 'Rooftop', true, false, '18:05') ]
  };
  function e(title, mood, content, wordCount, readingTime, tags, location, isPrivate, isFavorite, time){
    return { id: title+mood+time, title, mood, content, wordCount, readingTime, tags, location, isPrivate, isFavorite, time };
  }

  const daysInMonth = new Date(YEAR, MONTH_IDX + 1, 0).getDate();
  const allEntries = Object.values(ENTRIES).flat();
  const entryCount = allEntries.length;
  const writtenDays = Object.keys(ENTRIES).length;

  /* ================= Mood icon (inline SVG, no emoji) ================= */
  function moodIcon(mood, size){
    const c = MOODS[mood] || MOODS.calm;
    const s = size || 18;
    // Simple abstract stamp glyph, colored by mood.
    const glyphs = {
      happy:'<path d="M4 13a8 8 0 0 1 16 0" />',
      sad:'<path d="M4 9a8 8 0 0 0 16 0" /><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>',
      angry:'<path d="M6 8l3 2M18 8l-3 2M8 15h8" />',
      tired:'<path d="M6 9h12M8 13h8" /><path d="M5 17h5" />',
      thoughtful:'<path d="M6 12h12" /><circle cx="9" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1" fill="currentColor" stroke="none"/>',
      loved:'<path d="M12 20s-7-4.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.5-7 9-7 9z" />',
      cool:'<circle cx="12" cy="12" r="7" /><path d="M9 9l6 6" />',
      anxious:'<path d="M6 12c2-2 4-2 6 0s4 2 6 0" /><path d="M12 6v2" />',
      excited:'<path d="M12 4v3M12 17v3M4 12h3M17 12h3" /><circle cx="12" cy="12" r="3.5" />',
      calm:'<circle cx="12" cy="12" r="7" /><path d="M9 12h6" />',
      adoring:'<path d="M12 20s-6-4-6-8a3.5 3.5 0 0 1 6-2.3A3.5 3.5 0 0 1 18 12c0 4-6 8-6 8z" />',
      mindblown:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" />'
    };
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto">'+(glyphs[mood]||glyphs.calm)+'</svg>';
  }
  function star(filled){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="'+(filled?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 17l-5.3 2.6 1-5.8L3.5 9.7l5.9-.9z"/></svg>';
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ================= Helpers ================= */
  function dayMeta(d){
    const dt = new Date(YEAR, MONTH_IDX, d);
    return { wd: WD[dt.getDay()], long: dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) };
  }
  function wordCountFmt(n){ return n.toLocaleString('en-US')+' '+(n===1?'word':'words'); }
  function countFmt(n){ return n+' '+(n===1?'entry':'entries'); }

  /* ================= Render ================= */
  const weeksEl = document.getElementById('weeks');
  const selected = { day: TODAY };

  function entryCard(entry){
    const foot = [];
    foot.push('<span class="it"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+wordCountFmt(entry.wordCount)+'</span>');
    foot.push('<span>'+entry.readingTime+' min read</span>');
    if(entry.location) foot.push('<span class="it"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>'+esc(entry.location)+'</span>');
    if(entry.isPrivate) foot.push('<span class="it"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Private</span>');
    const tags = (entry.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join('');
    return '<article class="entry">'+
      '<div class="entry-top">'+
        '<span class="mood-chip">'+moodIcon(entry.mood,20)+MOOD_LABEL[entry.mood]+'</span>'+
        '<span style="font-family:JetBrains Mono,monospace;font-size:11px;color:var(--muted)">'+entry.time+'</span>'+
        '<button class="fav-btn '+(entry.isFavorite?'on':'')+'" type="button" data-fav="'+entry.id+'" aria-pressed="'+(entry.isFavorite?'true':'false')+'" aria-label="'+(entry.isFavorite?'Remove from favorites':'Add to favorites')+'" style="color:'+(entry.isFavorite?'var(--gold)':'var(--muted)')+'">'+star(entry.isFavorite)+'</button>'+
      '</div>'+
      '<h4 class="entry-title">'+esc(entry.title)+'</h4>'+
      '<p class="entry-body">'+esc(entry.content)+'</p>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      '<div class="entry-foot">'+foot.join('')+'</div>'+
    '</article>';
  }

  function dayNode(d){
    const m = dayMeta(d);
    const list = ENTRIES[d] || [];
    const has = list.length > 0;
    const isToday = d === TODAY;
    const isSel = selected.day === d;
    const words = list.reduce((a,x)=>a+x.wordCount,0);
    const mood = has ? list[list.length-1].mood : null;
    const cls = ['day', has?'has':'quiet', isToday?'today':'', isSel?'selected':'', isSel?'expanded':''].join(' ');

    let head = '<button class="day-head" type="button" data-day="'+d+'" aria-expanded="'+(isSel?'true':'false')+'" aria-label="'+m.long+', '+(has? countFmt(list.length)+', mood '+MOOD_LABEL[mood] : 'no entries')+'">'+
      '<span class="node-dot"></span>'+
      '<span class="day-num">'+d+'</span>'+
      '<span class="day-wd">'+m.wd+'</span>'+
      '<span class="day-tag">'+(isToday?'<span class="today-pill">TODAY</span>':(has?countFmt(list.length):''))+'</span>'+
    '</button>';

    let body = '';
    if(isSel){
      if(has){
        const cards = list.map(entryCard).join('');
        body = '<div class="detail"><div class="detail-card">'+
          '<div class="detail-head"><h3 class="detail-date">'+m.long+'</h3><div class="detail-meta">'+countFmt(list.length)+' · '+wordCountFmt(words)+'</div></div>'+
          cards+
          '<a class="write-btn outline" href="#" aria-label="Write this day, '+m.long+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4 16.5z"/></svg>Write this day</a>'+
        '</div></div>';
      } else {
        body = '<div class="detail"><div class="detail-card">'+
          '<div class="inline-empty"><div class="t">Nothing written yet</div><div class="d">This day is still a blank page. Start writing and it will appear here.</div>'+
          '<a class="write-btn gold" href="#" aria-label="Write this day, '+m.long+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Write this day</a></div>'+
        '</div></div>';
      }
    } else if(has){
      const last = list[list.length-1];
      const preview = last.content.length>92 ? last.content.slice(0,92)+'…' : last.content;
      body = '<div class="preview"><span class="mood-chip">'+moodIcon(last.mood,18)+MOOD_LABEL[last.mood]+'</span></div>'+
             '<p class="preview-text">'+esc(preview)+'</p>';
    }
    return '<li class="'+cls+'" data-dayli="'+d+'" style="'+(mood?'--mood:'+MOODS[mood]:'')+'">'+head+body+'</li>';
  }

  function render(){
    weeksEl.innerHTML = '';
    const rail = document.getElementById('railList');
    rail.innerHTML = '';
    // Precompute quiet runs across the WHOLE month (a run may span a week boundary).
    // A "quiet" day has no entries and is not the selected day. A run of >=3 quiet days
    // gets ONE italic annotation (a sibling <p>, never a wrapping <li>) before its markers.
    const quietNote = {}; // dayNumber -> "Oct A – B" label for the run that starts here
    {
      const isQuiet = (d)=> (ENTRIES[d]||[]).length===0 && selected.day!==d;
      let run = [];
      const flush = ()=>{
        if(run.length>=3){ quietNote[run[0]] = 'a quiet stretch — Oct '+run[0]+' – '+run[run.length-1]; }
        run = [];
      };
      for(let d=1; d<=daysInMonth; d++){ if(isQuiet(d)) run.push(d); else flush(); }
      flush();
    }
    // Build weeks (Sun-start rows to mirror the app's grid), but render chronologically.
    let weekNum = 0;
    const first = new Date(YEAR, MONTH_IDX, 1);
    const firstWkStart = new Date(first); firstWkStart.setDate(1 - first.getDay());
    let cursor = new Date(firstWkStart);
    while(true){
      const row = [];
      for(let i=0;i<7;i++){
        const inMonth = cursor.getMonth()===MONTH_IDX && cursor.getFullYear()===YEAR;
        row.push({ d: inMonth ? cursor.getDate() : null, date: new Date(cursor) });
        cursor.setDate(cursor.getDate()+1);
      }
      const monthDays = row.filter(r=>r.d!==null);
      if(monthDays.length===0) break;
      weekNum++;
      const ul = document.createElement('ul'); ul.className='week'; ul.id='wk'+weekNum;
      let html = '';
      // week band
      const startLbl = monthDays[0].date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const endLbl = monthDays[monthDays.length-1].date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const wkEntries = monthDays.reduce((a,r)=>a+((ENTRIES[r.d]||[]).length),0);
      html += '<li class="week-band" style="list-style:none"><span class="label">Week '+weekNum+'</span><span class="rule"></span><span class="range">'+startLbl+' – '+endLbl+' · '+wkEntries+(wkEntries===1?' entry':' entries')+'</span></li>';
      // day nodes; emit a quiet-run annotation (sibling <p>) once before a run of quiet days
      monthDays.forEach((r)=>{
        if(quietNote[r.d]){ html += '<p class="quiet-note">'+quietNote[r.d]+'</p>'; }
        html += dayNode(r.d);
      });
      ul.innerHTML = html;
      weeksEl.appendChild(ul);
      // rail jump
      const b = document.createElement('button');
      b.className='rail-jump'+(weekNum===weekOf(TODAY)?' active':''); b.type='button'; b.dataset.week=weekNum;
      b.innerHTML='Week '+weekNum+'<span class="cnt">'+startLbl+'</span>';
      b.addEventListener('click',()=>{ document.getElementById('wk'+weekNum).scrollIntoView({behavior:'smooth',block:'start'}); });
      rail.appendChild(b);
    }
    // minimap
    const mm = document.getElementById('mmRow'); mm.innerHTML='';
    for(let d=1; d<=daysInMonth; d++){
      const has = (ENTRIES[d]||[]).length>0;
      const mood = has ? ENTRIES[d][ENTRIES[d].length-1].mood : null;
      const tick = document.createElement('div'); tick.className='mm-tick';
      tick.innerHTML = (d===TODAY?'<span class="mm-caret"></span>':'')+
        '<span class="mm-num">'+d+'</span>'+
        '<span class="mm-dot'+(has?' has':'')+'" style="'+(has?'background:'+MOODS[mood]:'')+'"></span>';
      tick.title = dayMeta(d).long+(has?(' · '+countFmt((ENTRIES[d]||[]).length)):' · quiet');
      mm.appendChild(tick);
    }
    document.getElementById('monthSub').textContent = entryCount+' entries across '+writtenDays+' days';
    bindEvents();
    revealAll();
    drawSpine();
    scrollToToday();
  }
  function isSelectedDay(d){ return selected.day===d; }
  function weekOf(d){
    const dt = new Date(YEAR, MONTH_IDX, d);
    const start = new Date(YEAR, MONTH_IDX, 1); start.setDate(1-start.getDay());
    return Math.floor((dt - start)/(7*86400000))+1;
  }

  function bindEvents(){
    document.querySelectorAll('.day-head').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const d = +btn.dataset.day;
        if(selected.day===d) return; // clicking selected does nothing (already expanded)
        selected.day = d;
        render();
      });
    });
    document.querySelectorAll('.fav-btn').forEach(btn=>{
      btn.addEventListener('click',(ev)=>{
        ev.stopPropagation();
        // find the entry object and toggle
        const id = btn.dataset.fav;
        for(const k in ENTRIES){ const it = ENTRIES[k].find(x=>x.id===id); if(it){ it.isFavorite=!it.isFavorite; } }
        render();
      });
    });
    document.querySelectorAll('.write-btn').forEach(a=>{
      a.addEventListener('click',(ev)=>{ ev.preventDefault(); });
    });
  }

  /* Reveal + spine draw (reduced-motion safe) */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function revealAll(){
    document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
  }
  function drawSpine(){
    const spine = document.getElementById('spine');
    if(reduce){ spine.style.transform='none'; return; }
    spine.style.transform='scaleY(0)';
    requestAnimationFrame(()=>{ spine.style.transition='transform 400ms cubic-bezier(0.16,1,0.3,1)'; spine.style.transform='scaleY(1)'; });
  }
  function scrollToToday(){
    const el = document.querySelector('[data-dayli="'+TODAY+'"]');
    if(el) el.scrollIntoView({behavior: reduce?'auto':'smooth', block:'center'});
  }

  /* ================= Theme toggle ================= */
  const root = document.documentElement;
  const tbtn = document.getElementById('themeToggle');
  const tLabel = document.getElementById('toggleLabel');
  const tIcon = document.getElementById('toggleIcon');
  const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></g></svg>';
  const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>';
  function setTheme(t){
    root.setAttribute('data-theme', t);
    const night = t==='night';
    tbtn.setAttribute('aria-pressed', night?'true':'false');
    tbtn.setAttribute('aria-label', night?'Switch to light mode':'Switch to night mode');
    tLabel.textContent = night?'Light':'Night';
    tIcon.innerHTML = night?SUN:MOON;
    try{ localStorage.setItem('dd-theme', t); }catch(e){}
  }
  tbtn.addEventListener('click',()=>setTheme(root.getAttribute('data-theme')==='night'?'light':'night'));
  let saved=null; try{ saved=localStorage.getItem('dd-theme'); }catch(e){}
  if(saved) setTheme(saved);

  /* ================= Nav (month prev/next/today) — sketch behavior ================= */
  document.getElementById('prevBtn').addEventListener('click',()=>{
    document.getElementById('monthTitle').textContent='September 2026 (prev)';
  });
  document.getElementById('nextBtn').addEventListener('click',()=>{
    document.getElementById('monthTitle').textContent='November 2026 (next)';
  });
  document.getElementById('todayBtn').addEventListener('click',()=>{
    document.getElementById('monthTitle').textContent=MONTH;
    selected.day = TODAY; render();
  });

  render();
</script>
</body>
</html>
