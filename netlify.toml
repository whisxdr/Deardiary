[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 requires ^18 || >=20. Pin it so a Netlify default change cannot break the build.
  NODE_VERSION = "22"

# Client-side routing: every path must serve index.html or deep links 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers, kept identical to vercel.json so both hosts behave the same.
#
# script-src 'self' with no 'unsafe-inline' is what stops an inline handler in an
# imported backup from running. The bundle contains no eval and no new Function, so
# 'unsafe-eval' is not needed.
# style-src needs 'unsafe-inline' because Framer Motion writes style attributes, and
# fonts.googleapis.com serves the webfont stylesheet.
# img-src allows any https host because inserting an image by URL is a feature.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Content-hashed filenames, safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
