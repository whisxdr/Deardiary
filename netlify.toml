[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 requires ^18 || >=20. Pin it so a Netlify default change cannot break the build.
  NODE_VERSION = "22"

# Client-side routing: every path must serve index.html or deep links 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers, kept identical to vercel.json so both hosts behave the same.
#
# script-src is 'self' plus the sha256 of index.html's inline boot script, and no
# 'unsafe-inline': an inline handler in an imported backup still cannot run, while the
# theme script that has to beat the first paint is allowed by hash. The digest comes from
# scripts/sync-csp-hash.mjs, and scripts/check-csp-parity.mjs recomputes it.
# style-src needs 'unsafe-inline' because Framer Motion writes style attributes.
# Fonts are self-hosted, so font-src is 'self' with no third-party origin.
# img-src allows any https host because inserting an image by URL is a feature.
# connect-src is 'self': the diary is local-only, so no third-party origin is opened.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3SU9DRvRUSfzkyiTfPe5E1YQJCR8QyqaEKZPr7wHtlU='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Fonts and content-hashed assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
