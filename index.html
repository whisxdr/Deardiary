<!doctype html>
<html lang="en" data-theme="leather">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DearDiary - an immersive digital diary that feels like an old leather-bound book."
    />
    <meta name="theme-color" content="#3E2723" />
    <!--
      Fonts are self-hosted (see src/styles/fonts.css), so no third-party origin sits in
      the render-blocking path. These two preloads cover the first screen: the cover
      title uses Playfair Display and the body text uses Inter.
    -->
    <link rel="preload" href="/fonts/playfair-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>DearDiary — Every page is your story</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
