<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!--
    Static first frame of the opening screen, painted by index.html before any script runs.
    The geometry mirrors `CelestialStars` (viewBox 320, orbit radii 88 and 126, spikes
    46/13 and cross 33/9); it is an <img> rather than inline SVG so the browser counts it
    as a Largest Contentful Paint candidate, which pins LCP to this paint instead of to a
    paragraph that only appears after the bundle has loaded.
  -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#C9A961" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#C9A961" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#F5F0E6" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#C9A961" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="160" cy="160" r="160" fill="url(#halo)" />
  <circle cx="160" cy="160" r="88" fill="none" stroke="#C9A961" stroke-opacity="0.22" stroke-dasharray="3 10" />
  <circle cx="160" cy="160" r="126" fill="none" stroke="#C9A961" stroke-opacity="0.22" stroke-dasharray="2 14" />
  <g transform="translate(160 160)">
    <circle r="34" fill="url(#core)" />
    <path d="M0.00 -33.00L6.36 -6.36L33.00 0.00L6.36 6.36L0.00 33.00L-6.36 6.36L-33.00 0.00L-6.36 -6.36Z" fill="#C9A961" transform="rotate(45)" />
    <path d="M0.00 -46.00L9.19 -9.19L46.00 0.00L9.19 9.19L0.00 46.00L-9.19 9.19L-46.00 0.00L-9.19 -9.19Z" fill="#C9A961" fill-opacity="0.55" transform="rotate(22.5)" />
    <path d="M0.00 -46.00L9.19 -9.19L46.00 0.00L9.19 9.19L0.00 46.00L-9.19 9.19L-46.00 0.00L-9.19 -9.19Z" fill="#F5F0E6" fill-opacity="0.95" />
    <circle r="2.6" fill="#F5F0E6" />
  </g>
</svg>
